<p-sidebar
    [(visible)]="visible"
    position="right"
    [transitionOptions]="'.3s cubic-bezier(0, 0, 0.2, 1)'"
    styleClass="layout-profile-sidebar w-full sm:w-25rem" >
    <ng-template pTemplate="header">
        <div class="flex flex-column justify-content-between">
            <span>Matric: {{ authData?.providerId }}</span>
            <span>IP: 192.168.0.1</span>
        </div>
    </ng-template>

  <div class="flex flex-column justify-content-between h-full">
      <div class="flex flex-column mx-auto md:mx-0">
          <span class="mb-2 font-semibold">Olá,</span>
          <span class="text-color-secondary font-medium mb-5">
              {{ authData?.userName }}
          </span>
          <ul class="list-none m-0 p-0">
              <li>
                  <a
                      (click)="navigate('/atualizar-cadastro')"
                      class="cursor-pointer flex surface-border mb-3 p-3 align-items-center border-1 surface-border border-round hover:surface-hover transition-colors transition-duration-150">
                      <span>
                          <i class="pi pi-user text-xl text-primary"></i>
                      </span>
                      <div class="ml-3">
                          <span class="mb-2 font-semibold">Dados Cadastrais</span>
                          <p class="text-color-secondary m-0">
                              Atualizar informações de cadastro
                          </p>
                      </div>
                  </a>
              </li>
              <!-- <li>
                  <a class="cursor-pointer flex surface-border mb-3 p-3 align-items-center border-1 surface-border border-round hover:surface-hover transition-colors transition-duration-150">
                      <span>
                          <i class="pi pi-user text-xl text-primary"></i>
                      </span>
                      <div class="ml-3">
                          <span class="mb-2 font-semibold">Billing</span>
                          <p class="text-color-secondary m-0">Amet mimin mıollit</p>
                      </div>
                  </a>
              </li> -->
              <li>
                  <a
                      (click)="navigate('/trocar-senha')"
                      class="cursor-pointer flex surface-border mb-3 p-3 align-items-center border-1 surface-border border-round hover:surface-hover transition-colors transition-duration-150">
                      <span>
                          <i class="pi pi-key text-xl text-primary"></i>
                      </span>
                      <div class="ml-3">
                          <span class="mb-2 font-semibold">Alterar Senha</span>
                          <!-- <p class="text-color-secondary m-0">Exercitation veniam</p> -->
                      </div>
                  </a>
              </li>
          </ul>
      </div>

      <div>
        <hr />
            <a
                (click)="logout()"
                class="cursor-pointer flex surface-border mb-3 p-3 align-items-center border-1 surface-border border-round hover:surface-hover transition-colors transition-duration-150">
                <span>
                    <i class="pi pi-power-off text-xl text-red-500"></i>
                </span>
                <div class="ml-3">
                    <span class="mb-2 font-semibold">Sair</span>
                </div>
            </a>
      </div>
  </div>
</p-sidebar>

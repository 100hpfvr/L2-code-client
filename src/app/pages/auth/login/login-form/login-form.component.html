<form [formGroup]="loginForm" class="flex flex-column justify-content-center" (ngSubmit)="onSubmit()">
  <span class="p-input-icon-left w-full mb-4">
    <i class="pi pi-id-card"></i>
    <input
      id="identifier"
      type="text"
      formControlName="identifier"
      pInputText
      class="w-full"
      placeholder="Entidade"
    />
  </span>
  <span class="p-input-icon-left w-full mb-4">
    <i class="pi pi-lock"></i>
    <input
      id="password"
      type="password"
      formControlName="password"
      pInputText
      class="w-full"
      placeholder="Senha"
    />
  </span>

  <button
    title="Login"
    [disabled]="!loginForm.valid"
    type="submit"
    pButton
    pRipple
    label="Entrar no Portal"
    class=""
  ></button>
</form>

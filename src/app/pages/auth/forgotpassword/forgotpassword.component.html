<form class="px-5 min-h-screen flex justify-content-center align-items-center" [formGroup]="recoverPasswordForm">
    <div
        class="border-1 surface-border surface-card border-round py-7 px-4 md:px-7 z-1"
        style="max-width: 480px"
    >
        <div class="mb-4">
            <div class="text-900 text-xl font-bold mb-2">
                Recuperação de Senha
            </div>
            <span class="text-600 font-medium"
                >Informe o dados abaixo para realizarmos a recuperação de
                senha!</span
            >
        </div>
        <div class="flex flex-column">
            <span class="p-input-icon-left w-full mb-4">
                <i class="pi pi-id-card"></i>
                <input
                    id="documentNumber"
                    type="text"
                    formControlName="documentNumber"
                    pInputText
                    class="w-full"
                    placeholder="CNPJ/CPF"
                    mask="000.000.000-00||00.000.000/0000-00"
                />
            </span>
            <span class="p-input-icon-left w-full mb-4">
                <i class="pi pi-envelope"></i>
                <input
                    id="email"
                    type="text"
                    formControlName="email"
                    pInputText
                    class="w-full"
                    placeholder="Email"
                />
            </span>
            <div class="flex flex-wrap gap-2 justify-content-between">
                <button
                    pButton
                    pRipple
                    label="Voltar"
                    class="flex-auto p-button-outlined bg-white"
                    title="Voltar"
                    [routerLink]="['/auth/login']"
                ></button>
                <button
                    pButton
                    pRipple
                    label="Continuar"
                    class="flex-auto"
                    title="Continuar"
                    (click)="recoverPassword(this.recoverPasswordForm)"
                ></button>
            </div>
        </div>
    </div>
</form>

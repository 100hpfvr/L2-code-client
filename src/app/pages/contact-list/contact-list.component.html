<action-button [route]="route.url">
  <p-button [label]="'Novo Contato'" [icon]="'pi pi-plus'"></p-button>
</action-button>
<div class="card border-none surface-section text-center min">
  <p-table [value]="contacts">
    <ng-template #header>
      <tr>
        <th style="width: 4rem"></th>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Celular</th>
        <th>Telefone</th>
        <th>Status</th>
        <th>Data Cadastro</th>
      </tr>
    </ng-template>
    <ng-template #body let-contact>
      <tr>
        <td class="text-center  text-yellow-500"> @if (contact.favorito === 'S') {
          <i class="pi pi-star-fill"></i>
        } @else {
          <i class="pi pi-star"></i>
        }
        </td>
        <td>{{ contact.nome }}</td>
        <td>{{ contact.email }}</td>
        <td>{{ contact.celular }}</td>
        <td>{{ contact.telefone }}</td>
        <td>
          @if (contact.ativo == 'S') {
            <p-badge value="Ativo" [severity]="'success'"></p-badge>
          } @else {
            <p-badge value="Inativo" [severity]="'danger'"></p-badge>
          }
        </td>
        <td>{{ contact.dataCadastro | date: 'dd/MM/yyy' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
